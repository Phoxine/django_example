<h1>優化文章列表</h1>

{% for post in posts %}
  <article>
    <h2><a href="/post/optimized/{{ post.id }}/">{{ post.title }}</a></h2>
    <p>作者：{{ post.author.name }}</p>
    <p>建立時間：{{ post.created_at }}</p>
    <p>評分：{{ post.rating }}</p>
    <p>留言數：{{ post.num_comments|default:post.comments.count }}</p>
  </article>
{% empty %}
  <p>目前沒有文章。</p>
{% endfor %}
